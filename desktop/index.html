<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Home Desktop</title><link rel="stylesheet" href="/desktop/desktop.css"><script type="module" src="/desktop/desktop.js"></script></head>
<body>
<header><a class="brand" href="/desktop">Home Desktop</a><span id="status" role="status">Connecting…</span><nav aria-label="Desktop controls"><button id="reconnect" type="button">Reconnect</button><button id="fit" type="button" aria-pressed="true">Fit screen</button><button id="command" type="button" aria-label="Hold Command key" title="Hold the Mac Command key" aria-pressed="false" disabled>⌘</button><button id="fullscreen" type="button">Fullscreen</button><button id="lock" type="button" disabled>Lock viewer</button></nav></header>
<main id="screen" aria-label="Remote Mac desktop"></main>
<section id="panel" class="overlay"><div class="card">
<div class="icon" aria-hidden="true">▣</div><h1 id="heading">Your Mac, wherever you are.</h1><p id="message">Checking the connection to your home laptop.</p>
<form id="login" hidden><label for="password">Website password</label><input id="password" type="password" autocomplete="current-password" maxlength="1024" required><label for="code">Authenticator code</label><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button type="submit">Unlock desktop</button></form>
<form id="mac-login" hidden><label id="username-label" for="username">Mac username</label><input id="username" type="text" autocomplete="username" value="aaravsinha"><label for="mac-password">Mac login password</label><input id="mac-password" type="password" autocomplete="off" required><button type="submit">Connect to Mac</button><p class="note">Used for this connection only. It is not saved by the website.</p></form>
<p id="error" role="alert"></p><p class="note">Your apps stay open when you close this page. Keep the Mac plugged in, awake, and connected to the internet.</p><a class="browser-link" href="/browser">Open Home Browser →</a>
</div></section>
</body></html>
